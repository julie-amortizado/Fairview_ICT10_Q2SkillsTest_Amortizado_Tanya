
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Element Information</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>

    * {
        box-sizing: border-box;
        font-family: 'Arial', sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 0;

        background-image: url('https://i.pinimg.com/736x/3d/a5/e1/3da5e17c3139036414c2e5eee516b125.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        padding: 20px;
    }

    .card {
        width: 350px;
        max-width: 100%;
        border-radius: 15px;
        background-color: rgba(26, 18, 29, 0.65);
        box-shadow: 1px 1px 3px 3px rgba(248, 207, 254, 0.471);
        color: white;
        display: flex;
        flex-direction: column;
        padding-bottom: 15px;
    }

    .header {
        text-align: center;
        padding: 15px 15px 5px;
    }

    .header h1 {
        margin: 4px 0;
        font-size: 24px;
    }

    .header p {
        font-size: 12px;
        line-height: 16px;
        padding: 0 5px;
        margin: 4px 0;
    }

    .inputs {
        padding: 10px 18px;
    }

    .inputs label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 5px;
    }

    input[type="text"] {
        color: white;
        width: 100%;
        padding: 10px;
        margin: 5px 0 10px 0;
        border-radius: 10px;
        background-color: transparent;
        border: 1.3px solid rgb(165, 165, 165);
        box-shadow: 1px 1px 1px rgba(0, 0, 0, 0.41);
        outline: none;
    }

    input[type="text"]:focus {
        border-color: #ab7cb4;
    }

    ::placeholder {
        color: rgba(255, 255, 255, 0.618);
    }

    .footer {
        text-align: center;
        padding: 0 18px;
    }

    .footer button {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: none;
        color: white;
        background: linear-gradient(#f4e5ff, #524055);
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
    }

    .footer button:hover {
        background: linear-gradient(#6c5674, #eae1f7);
    }

    .result {
        width: 350px;
        max-width: 100%;
        margin-top: 12px;
        padding: 15px;
        border-radius: 10px;
        background-color: rgba(26, 18, 29, 0.65);
        color: white;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
    }

    .result h3 {
        margin: 3px 0 10px;
        font-size: 15px;
    }

    .result p {
        margin: 6px 0;
    }

    .instruction {
        width: 350px;
        max-width: 100%;
        margin-top: 10px;
        padding: 10px;
        border-radius: 8px;
        background-color:  rgba(26, 18, 29, 0.65);
        color: white;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        line-height: 17px;
    }

    @media screen and (max-width: 480px) {
        .card, .result, .instruction {
            width: 100%;
        }

        .header h1 {
            font-size: 21px;
        }
    }

    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="header">
                <h1>Element Information</h1>
                <p>
                    Welcome to our Element Information Checker!
                    Enter a non-metal element to view its information.
                </p>
            </div>

            <div class="inputs">
                <label>Element Name</label>

                <input
                    type="text"
                    id="element1"
                    placeholder="Enter Element (e.g., HYDROGEN)"
                >
            </div>

            <div class="footer">
                <button py-click="search_element">
                    Search Element
                </button>
            </div>

        </div>

        <div class="result">

            <h3>SEARCH RESULT</h3>

            <p><b>Element Code:</b> <span id="symbol"></span></p>

            <p><b>Element Name:</b> <span id="name"></span></p>

            <p><b>Atomic Number:</b> <span id="number"></span></p>

            <p><b>Atomic Mass:</b> <span id="mass"></span></p>

        </div>

        <div class="instruction">
            Kindly enter an <b>Non-metal</b> Element to view its
            atomic number and atomic mass.
        </div>

    </div>

    <!-- Connect Python file -->
    <script type="py" src="main.py"></script>

</body>
</html>
